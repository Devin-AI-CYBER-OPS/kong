apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kong-dev

resources:
  - ../../base

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: kong-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

  - target:
      kind: PodDisruptionBudget
      name: kong-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0

commonLabels:
  environment: dev
