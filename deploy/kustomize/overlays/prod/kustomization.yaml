apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kong-prod

resources:
  - ../../base

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: kong-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  - target:
      kind: PodDisruptionBudget
      name: kong-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 2

commonLabels:
  environment: prod
