apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kong-staging

resources:
  - ../../base

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: kong-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6

commonLabels:
  environment: staging
