# Elastic Agent DaemonSet for collecting Kong container logs and Kubernetes metadata.
# References: NIST SP 800-53 AU-2/AU-6, STIG V-222531

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: elastic-agent
  namespace: elastic-system
  labels:
    app.kubernetes.io/name: elastic-agent
    app.kubernetes.io/part-of: kong-monitoring
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "elastic-agent requires root for host log access"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elastic-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastic-agent
      annotations:
        # Security: elastic-agent requires root (UID 0) for host log file access.
        # Compensating controls: allowPrivilegeEscalation=false, readOnlyRootFilesystem=true,
        # host paths mounted read-only.
        ignore-check.kube-linter.io/run-as-non-root: "elastic-agent requires root for host log access"
    spec:
      serviceAccountName: elastic-agent
      # Security: agent needs root for host log file access; securityContext
      # constraints applied at container level to satisfy kube-linter
      securityContext:
        runAsUser: 0
      tolerations:
        - key: "security-zone"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: elastic-agent
          image: docker.elastic.co/beats/elastic-agent:8.17.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: FLEET_URL
              valueFrom:
                secretKeyRef:
                  name: elastic-agent-config
                  key: fleet-url
            - name: FLEET_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: elastic-agent-config
                  key: enrollment-token
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: agent-state
              mountPath: /usr/share/elastic-agent/state
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
        - name: agent-state
          emptyDir: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: elastic-system
  labels:
    app.kubernetes.io/name: elastic-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: elastic-agent
subjects:
  - kind: ServiceAccount
    name: elastic-agent
    namespace: elastic-system
